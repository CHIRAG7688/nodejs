```yaml
name: Docker CI/CD Practice

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:

      # 1. Get code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests
      - name: Run Tests
        run: npm test --if-present

      # 5. Build Docker image
      - name: Build Docker Image
        run: docker build -t my-node-app .

      # 6. Run application inside Docker
      - name: Run Docker Container
        run: |
          docker run -d \
            --name my-node-app \
            -p 3000:3000 \
            my-node-app

      # 7. Check running container
      - name: Check Container
        run: docker ps

      # 8. Check application
      - name: Test Application
        run: |
          sleep 5
          curl http://localhost:3000

      # 9. Show container logs if needed
      - name: Container Logs
        if: always()
        run: docker logs my-node-app
```
